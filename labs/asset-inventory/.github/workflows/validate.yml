name: Validate asset inventory
on:
  push:
  pull_request:
jobs:
  inventory-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate sample register
        run: python scripts/validate_inventory.py data/sample_inventory.csv
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
